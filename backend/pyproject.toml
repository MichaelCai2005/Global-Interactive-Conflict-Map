[project]
name = "conflict-map-backend"
version = "0.1.0"
description = "Ingests conflict event data, cleans and links it, and serves it over a REST API."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "numpy>=2"]
# Claude reads articles for link boards (app.boards.extract); without it the gazetteer does.
ai = ["anthropic>=1.15"]
# Fitting and backtesting the risk score weights (app.risk_model); scoring itself needs none.
model = ["numpy>=2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.csv", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# The formatter handles line length; long lines left over are SQL strings.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
