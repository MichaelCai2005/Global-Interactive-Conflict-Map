# Local development only. A hosted deployment uses Neon and the host's secret store
# (docs/hosting.md). Set POSTGRES_PASSWORD in a root .env file to change the password;
# ports bind to this machine only, so nothing on the network can reach the database.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: conflict
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conflict}
      POSTGRES_DB: conflict
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conflict"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://conflict:${POSTGRES_PASSWORD:-conflict}@db:5432/conflict
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
