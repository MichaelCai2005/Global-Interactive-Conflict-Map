services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: conflict
      POSTGRES_PASSWORD: conflict
      POSTGRES_DB: conflict
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conflict"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://conflict:conflict@db:5432/conflict
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
