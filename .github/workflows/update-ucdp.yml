# Loads UCDP's monthly Candidate events into the hosted database, then rebuilds this year's
# cell features and the risk scores. UCDP posts each month's file around the 20th of the
# next, so this runs on the 23rd. Every file of the year is loaded again each time, which
# picks up UCDP's corrections to earlier months and any month a run missed.
#
# Run it by hand with a GED version (e.g. 27.1) when the yearly release comes out, usually
# in June. That loads the release, drops the Candidate events it replaces, and rebuilds
# every month's features. It updates the live database in place, so boards and anything
# else made on the site stay, unlike `python -m app.publish copy --replace`.
#
# Needs the HOSTED_DATABASE_URL secret, like update-hosted-data.yml.
name: Update UCDP data

on:
  schedule:
    - cron: "0 6 23 * *"
  workflow_dispatch:
    inputs:
      ged_version:
        description: "Also load this yearly GED release, e.g. 27.1 (default: Candidate files only)"
        required: false

concurrency:
  group: hosted-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
    steps:
      - name: Check for the database secret
        if: env.DATABASE_URL == ''
        # Runs before checkout, so the default backend directory does not exist yet.
        working-directory: .
        run: echo "::notice::HOSTED_DATABASE_URL is not set, so there is nothing to update."
      - uses: actions/checkout@v5
        if: env.DATABASE_URL != ''
      - uses: actions/setup-python@v6
        if: env.DATABASE_URL != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        if: env.DATABASE_URL != ''
        run: pip install .
      - name: Migrate
        if: env.DATABASE_URL != ''
        run: alembic upgrade head
      - name: Load the yearly GED release
        if: env.DATABASE_URL != '' && inputs.ged_version != ''
        env:
          VERSION: ${{ inputs.ged_version }}
        run: |
          python -m app.ingest download ucdp --version "$VERSION" --out data
          python -m app.ingest load ucdp data/ucdp/ged*-csv.zip
          echo "FIRST_MONTH=1989-01" >> "$GITHUB_ENV"
      - name: Load Candidate events
        if: env.DATABASE_URL != ''
        run: |
          python -m app.ingest download ucdp-candidate --out data
          # Oldest first (v26_0_2 before v26_0_10), so a later month's corrections win.
          mapfile -t files < <(ls data/ucdp/GEDEvent_v*.csv 2>/dev/null | sort -V)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::UCDP has posted no Candidate files for this year yet"
          else
            python -m app.ingest load ucdp "${files[@]}"
          fi
          # From January of the oldest file's year, unless a GED release needs everything.
          if [ -z "$FIRST_MONTH" ]; then
            first=$(basename "${files[0]:-GEDEvent_v$(date -u +%y)_0_1.csv}" | sed -E 's/GEDEvent_v([0-9]+)_.*/20\1-01/')
            echo "FIRST_MONTH=$first" >> "$GITHUB_ENV"
          fi
      - name: Rebuild features and risk scores
        if: env.DATABASE_URL != ''
        run: |
          python -m app.ingest build-features --start "$FIRST_MONTH" --end "$(date -u +%Y-%m)"
          python -m app.risk build
      - name: Check nothing unpublishable arrived
        if: env.DATABASE_URL != ''
        run: python -m app.publish check
      - name: Report database size
        if: env.DATABASE_URL != ''
        run: python -m app.publish size --warn-mb "${{ vars.DB_SIZE_WARN_MB || 450 }}"
