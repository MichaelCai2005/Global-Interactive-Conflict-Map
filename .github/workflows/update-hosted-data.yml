# Keeps the hosted database current: loads the last three days of GDELT events, rebuilds
# those months' cell features and the risk scores, and prunes old live observations. Loading
# a day again changes nothing, so the overlap fills in a night that failed or found no file
# yet. Runs nightly and on demand (Actions tab > Update hosted data > Run workflow).
# update-gdelt-live.yml loads GDELT's 15-minute files through the day; these daily files
# are the backstop for any it missed, though events found only here have no report time
# and no article list. UCDP's monthly data has its own workflow, update-ucdp.yml.
#
# Needs a repository secret HOSTED_DATABASE_URL, the hosted database's direct (not pooled)
# URL in the form postgresql+psycopg://user:pass@host/db?sslmode=require. Without it every
# step is skipped. GitHub only runs schedules from the default branch, so this starts
# nightly once it is merged there.
name: Update hosted data

on:
  schedule:
    # GDELT posts each day's file early the next morning (US Eastern).
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Load only this GDELT day, YYYY-MM-DD (default: the last three days)"
        required: false

concurrency:
  group: hosted-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
    steps:
      - name: Check for the database secret
        if: env.DATABASE_URL == ''
        # Runs before checkout, so the default backend directory does not exist yet.
        working-directory: .
        run: echo "::notice::HOSTED_DATABASE_URL is not set, so there is nothing to update."
      - uses: actions/checkout@v5
        if: env.DATABASE_URL != ''
      - uses: actions/setup-python@v6
        if: env.DATABASE_URL != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        if: env.DATABASE_URL != ''
        run: pip install .
      - name: Migrate
        if: env.DATABASE_URL != ''
        run: alembic upgrade head
      - name: Load GDELT
        if: env.DATABASE_URL != ''
        env:
          DAY: ${{ inputs.day }}
        run: |
          start="${DAY:-$(date -u -d '3 days ago' +%F)}"
          end="${DAY:-$(date -u -d yesterday +%F)}"
          echo "FIRST_MONTH=${start:0:7}" >> "$GITHUB_ENV"
          echo "LAST_MONTH=${end:0:7}" >> "$GITHUB_ENV"
          python -m app.ingest download gdelt --start "$start" --end "$end" --out data
          shopt -s nullglob
          files=(data/gdelt/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::GDELT has no files for $start to $end yet"
            exit 0
          fi
          python -m app.ingest load gdelt "${files[@]}"
      - name: Rebuild features and risk scores
        if: env.DATABASE_URL != ''
        run: |
          python -m app.ingest build-features --start "$FIRST_MONTH" --end "$LAST_MONTH"
          python -m app.risk build
      - name: Prune old live observations
        if: env.DATABASE_URL != ''
        run: python -m app.live prune --days 90
      - name: Stop matching new GDELT articles to month-old events
        if: env.DATABASE_URL != ''
        run: python -m app.ingest prune-gdelt-ids --days 30
      - name: Check nothing unpublishable arrived
        if: env.DATABASE_URL != ''
        run: python -m app.publish check
      - name: Report database size
        if: env.DATABASE_URL != ''
        # Warns in the run summary past DB_SIZE_WARN_MB (a repository variable), which
        # defaults to 450 for Neon's 0.5 GB free plan. Raise it on a paid plan.
        run: python -m app.publish size --warn-mb "${{ vars.DB_SIZE_WARN_MB || 450 }}"
