# Keeps the hosted map within a quarter hour of the news: loads GDELT 2.0's 15-minute Events
# and Mentions files into the hosted database. Each run loads every quarter hour of the past
# day not loaded yet, so a late or missing GDELT file, or a skipped run, is picked up by a
# later one. GDELT posts each file a few minutes after the quarter hour it closes.
#
# Cell features and risk scores are monthly and weekly, so they are rebuilt nightly by
# update-hosted-data.yml, not here. Like that workflow, this needs the repository secret
# HOSTED_DATABASE_URL and runs on a schedule only from the default branch.
name: Update GDELT every 15 minutes

on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:

concurrency:
  # Shared with the nightly update, so the two never load into the database at once.
  group: hosted-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
    steps:
      - name: Check for the database secret
        if: env.DATABASE_URL == ''
        # Runs before checkout, so the default backend directory does not exist yet.
        working-directory: .
        run: echo "::notice::HOSTED_DATABASE_URL is not set, so there is nothing to update."
      - uses: actions/checkout@v5
        if: env.DATABASE_URL != ''
      - uses: actions/setup-python@v6
        if: env.DATABASE_URL != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        if: env.DATABASE_URL != ''
        run: pip install .
      - name: Migrate
        if: env.DATABASE_URL != ''
        run: alembic upgrade head
      - name: Load GDELT's newest quarter hours
        if: env.DATABASE_URL != ''
        run: python -m app.ingest live --out data
      - name: Check nothing unpublishable arrived
        if: env.DATABASE_URL != ''
        run: python -m app.publish check
