# Publishes the frontend to GitHub Pages, at https://<user>.github.io/<repo>/. Pages only
# serves files, so the API runs on Render (render.yaml) and the frontend calls it there.
#
# Needs, once:
# - Settings > Pages > Build and deployment > Source: "GitHub Actions".
# - A repository variable API_URL (Settings > Secrets and variables > Actions > Variables)
#   holding the API's address, e.g. https://conflict-map-api.onrender.com, with no
#   trailing slash.
#
# Pages deploys only from the default branch, so pushes to other branches are skipped.
name: Deploy site to GitHub Pages

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: ${{ vars.API_URL }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check for the API address
        if: env.API_URL == ''
        run: echo "::notice::API_URL is not set, so Pages deploy is skipped (see docs/hosting.md)."
      - uses: actions/checkout@v4
        if: env.API_URL != ''
      - uses: actions/setup-node@v4
        if: env.API_URL != ''
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: env.API_URL != ''
      - name: Build
        if: env.API_URL != ''
        run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ env.API_URL }}
      - uses: actions/configure-pages@v5
        if: env.API_URL != ''
      - uses: actions/upload-pages-artifact@v3
        if: env.API_URL != ''
        with:
          path: frontend/dist
      - id: deploy
        if: env.API_URL != ''
        uses: actions/deploy-pages@v4
